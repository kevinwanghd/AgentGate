name: AgentGate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# auto-merge 任务需要 contents: write（enablePullRequestAutoMerge）；
# 可复用工作流的 GITHUB_TOKEN 权限不得超过 caller 此处声明的上限
permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  agentgate:
    uses: __AGENTGATE_REPO__/.github/workflows/agentgate.yml@__AGENTGATE_REF__
    secrets: inherit
    with:
      config-path: governance.config.yml
      agentgate-repository: __AGENTGATE_REPO__
      agentgate-ref: __AGENTGATE_REF__
