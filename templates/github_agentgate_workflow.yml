name: AgentGate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# 同一 PR 新推送/编辑描述时取消旧运行, 避免重复占用 runner
concurrency:
  group: agentgate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  agentgate:
    uses: __AGENTGATE_REPO__/.github/workflows/agentgate.yml@__AGENTGATE_REF__
    secrets: inherit
    with:
      config-path: governance.config.yml
      agentgate-repository: __AGENTGATE_REPO__
      agentgate-ref: __AGENTGATE_REF__
