api_version: agentgate.io/profile/v1
kind: LanguageProfile
name: flutter-mobile
version: 1.0.0

languages: [dart, flutter]
source_extensions: [.dart, .yaml, .yml]
test_patterns: ["**/*_test.dart", "**/test/**", "**/tests/**"]
generated_patterns: ["**/*.g.dart", "**/*.freezed.dart"]
commands:
  analyze: flutter analyze
  test: flutter test
required_checks: [risk-scan, secret-scan, mr-validate, test-check, flutter-analyze, flutter-test]

checks:
  dart-format:
    type: format
    command:
      - dart
      - format
      - --output=none
      - --set-exit-if-changed
      - .

  flutter-analyze:
    type: static-analysis
    command:
      - flutter
      - analyze

  flutter-test:
    type: unit-test
    command:
      - flutter
      - test
      - --machine
    report:
      format: junit
      path: build/agentgate/flutter-test.xml

  flutter-coverage:
    type: coverage
    command:
      - flutter
      - test
      - --coverage
    report:
      format: lcov
      path: coverage/lcov.info

  android-debug-build:
    type: build
    command:
      - flutter
      - build
      - apk
      - --debug

# 注意: 不在此覆盖 secret-scan —— CI 统一由 scan_secrets.py 产出该 check
# (与 go-bazel / dotnet-monorepo 一致); gitleaks 不在内部 CI 镜像中。

plans:
  low:
    - dart-format
    - flutter-analyze

  medium:
    - dart-format
    - flutter-analyze
    - flutter-test

  high:
    - dart-format
    - flutter-analyze
    - flutter-test
    - flutter-coverage
    - android-debug-build

  critical:
    - dart-format
    - flutter-analyze
    - flutter-test
    - flutter-coverage
    - android-debug-build

risk_paths:
  high:
    - lib/**/auth/**
    - lib/**/payment/**
    - lib/**/account/**
    - lib/**/database/**
    - lib/**/drift/**
    - android/**
    - ios/**
  critical:
    - .github/workflows/**
    - .gitlab-ci.yml
    - governance/**
    - governance.config.yml
    - "**/*.jks"
    - "**/*.keystore"
    - "**/*secret*"
