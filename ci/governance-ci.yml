# governance-ci.yml — 中心 CI 治理模板
#
# 平台管理员将此文件发布到 governance 中心仓库后,
# 各业务仓库在 .gitlab-ci.yml 里一行 include 即可接入所有治理 job:
#
#   include:
#     - project: 'your-group/governance'
#       ref: main
#       file: '/ci/governance-ci.yml'
#
# 可通过 CI/CD Variables 覆盖默认值 (项目设置 → Variables):
#   GOVERNANCE_SOFT_DEADLINE  软门禁截止日期, 如 2026-09-30
#   GOVERNANCE_CONFIG_PATH    governance.config.yml 的仓库内路径
#   GOVERNANCE_REPORT_OUTPUT  周报输出路径, 默认 governance/reports/expired-annotations.md
#   GOVERNANCE_MERGE_BOT_TOKEN  受保护/Masked 的 Merge Bot token, 仅自动合并 job 使用

stages:
  - governance   # 风险/密钥/MR/测试检查 + 语言 job（同 stage 以满足 GitLab 11.4 dependencies 约束）
  - test         # gate-decision（依赖所有 governance job）
  - build
  - merge

variables:
  GOVERNANCE_PY_IMAGE: "swr.cn-north-4.myhuaweicloud.com/adbidding/governance/python-ci:latest"
  GOVERNANCE_SECRET_IMAGE: "swr.cn-north-4.myhuaweicloud.com/adbidding/governance/gitleaks:latest"

# ── 1. 风险扫描: 硬阻断 ──────────────────────────────────────────────────────
governance:risk-scan:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - branches
    - merge_requests
  variables:
    GIT_DEPTH: 0
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      BASE="origin/$TB"
      CONFIG_ARG=""
      CONFIG_PATH="${GOVERNANCE_CONFIG_PATH:-governance/governance.config.yml}"
      [ -f "$CONFIG_PATH" ] && CONFIG_ARG="--config $CONFIG_PATH"
      python governance/scripts/scan_risks.py --diff-base "$BASE" $CONFIG_ARG
      EXIT_CODE=$?
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-risk-scan-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-risk-scan-result.json
    expire_in: 1 day
  allow_failure: false

# ── 2. 密钥扫描: 硬阻断 ──────────────────────────────────────────────────────
governance:secret-scan:
  stage: governance
  image:
    name: "$GOVERNANCE_SECRET_IMAGE"
    entrypoint: [""]
  only:
    - branches
    - merge_requests
  variables:
    GIT_DEPTH: 0
  before_script:
    - git --version
    - gitleaks version
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      BASE="origin/$TB"
      gitleaks detect \
        --source . \
        --log-opts="${BASE}..HEAD" \
        --redact \
        --no-banner \
        --verbose
      EXIT_CODE=$?
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-secret-scan-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-secret-scan-result.json
    expire_in: 1 day
  allow_failure: false

# ── 3. MR 描述校验: 软→硬 ───────────────────────────────────────────────────
governance:mr-validate:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - merge_requests
  variables:
    GIT_DEPTH: 0          # 需完整历史以读取 commit 里的 AI-Usage trailer
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      BASE="origin/$TB"
      CONFIG_ARG=""
      [ -f "${GOVERNANCE_CONFIG_PATH:-governance/governance.config.yml}" ] \
        && CONFIG_ARG="--config ${GOVERNANCE_CONFIG_PATH:-governance/governance.config.yml}"
      echo "$CI_MERGE_REQUEST_DESCRIPTION" \
        | python governance/scripts/validate_mr.py --diff-base "$BASE" $CONFIG_ARG
      EXIT_CODE=$?
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-mr-validate-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-mr-validate-result.json
    expire_in: 1 day
  allow_failure: false

# ── 4. 测试痕迹检测: 软→硬 (失败测试记录无条件硬拦) ──────────────────────────
# 改动的生产代码是否做过测试。CI 看不到 .governance/ 证据 (gitignore),
# 退回读 commit 的 Tested: trailer。
governance:test-check:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - branches
    - merge_requests
  variables:
    GIT_DEPTH: 0
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      BASE="origin/$TB"
      CONFIG_ARG=""
      [ -f "${GOVERNANCE_CONFIG_PATH:-governance/governance.config.yml}" ] \
        && CONFIG_ARG="--config ${GOVERNANCE_CONFIG_PATH:-governance/governance.config.yml}"
      python governance/scripts/check_tested.py --diff-base "$BASE" $CONFIG_ARG
      EXIT_CODE=$?
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-test-check-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-test-check-result.json
    expire_in: 1 day
  allow_failure: false

# ── 5. 过期注解周报: 仅报告, 不阻断 ─────────────────────────────────────────
# 每周一 08:00 触发 (需在 GitLab → CI/CD → Schedules 里新建 pipeline 指向此分支)
# 也可在 MR 流水线里手动触发 (when: manual) 随时生成快照。
governance:expired-report:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - schedules
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      OUTPUT="${GOVERNANCE_REPORT_OUTPUT:-governance/reports/expired-annotations.md}"
      python governance/scripts/report_expired.py \
        --root . \
        --output "$OUTPUT"
  artifacts:
    paths:
      - governance/reports/
  allow_failure: true

governance:expired-report-manual:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - branches
    - merge_requests
  when: manual
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      OUTPUT="${GOVERNANCE_REPORT_OUTPUT:-governance/reports/expired-annotations.md}"
      python governance/scripts/report_expired.py \
        --root . \
        --output "$OUTPUT"
  artifacts:
    paths:
      - governance/reports/
  allow_failure: true

# ── 6. Go 受影响包测试: 硬阻断 (仅 Go 仓库) ─────────────────────────────────
# 前提: 仓库根目录存在 go.mod 且可运行 go test。
# Bazel 单仓需覆盖此 job 或设置 GOVERNANCE_SKIP_GO_TEST=true 跳过。
governance:go-test:
  stage: governance
  image: golang:1.22-bookworm
  only:
    - branches
    - merge_requests
  variables:
    GIT_DEPTH: 0
    GOFLAGS: "-mod=mod"
  script:
    - |
      if [ "${GOVERNANCE_SKIP_GO_TEST:-false}" = "true" ]; then
        echo "[go-test] GOVERNANCE_SKIP_GO_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-go-test-result.json
        exit 0
      fi
      # 仓库没有 go.mod 时静默跳过 (非 Go 仓库)
      if [ ! -f go.mod ]; then
        echo "[go-test] 未找到 go.mod, 跳过 Go 测试。"
        echo "{\"status\": \"skip\"}" > governance-go-test-result.json
        exit 0
      fi
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      BASE="origin/$TB"
      python governance/scripts/run_affected_tests.py \
        --diff-base "$BASE" \
        --timeout "${GOVERNANCE_GO_TEST_TIMEOUT:-120}"
      EXIT_CODE=$?
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-go-test-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-go-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7a. Flutter/Dart 测试: 无 pubspec.yaml 时自动跳过 ────────────────────────
governance:flutter-test:
  stage: governance
  image: ghcr.io/cirruslabs/flutter:stable
  only:
    - branches
    - merge_requests
  script:
    - |
      if [ "${GOVERNANCE_SKIP_FLUTTER_TEST:-false}" = "true" ]; then
        echo "[flutter-test] GOVERNANCE_SKIP_FLUTTER_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-flutter-test-result.json
        exit 0
      fi
      DIRS=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | xargs -I{} dirname {} 2>/dev/null)
      if [ -z "$DIRS" ]; then
        echo "[flutter-test] 未找到 pubspec.yaml, 跳过 Flutter 测试。"
        echo "{\"status\": \"skip\"}" > governance-flutter-test-result.json
        exit 0
      fi
      OVERALL=0
      for DIR in $DIRS; do
        echo "[flutter-test] 在 $DIR 运行 flutter test"
        (cd "$DIR" && flutter pub get && flutter test) || OVERALL=1
      done
      echo "{\"status\": \"$([ $OVERALL -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-flutter-test-result.json
      exit $OVERALL
  artifacts:
    paths:
      - governance-flutter-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7b. Python 测试: 无 requirements.txt / pyproject.toml / setup.py 时跳过 ──
governance:python-test:
  stage: governance
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - branches
    - merge_requests
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      if [ "${GOVERNANCE_SKIP_PYTHON_TEST:-false}" = "true" ]; then
        echo "[python-test] GOVERNANCE_SKIP_PYTHON_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-python-test-result.json
        exit 0
      fi
      DIRS=$(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) \
             -not -path "*/.*" -not -path "*/node_modules/*" | xargs -I{} dirname {} | sort -u)
      if [ -z "$DIRS" ]; then
        echo "[python-test] 未找到 Python 项目标记文件, 跳过 Python 测试。"
        echo "{\"status\": \"skip\"}" > governance-python-test-result.json
        exit 0
      fi
      pip install -q pytest pyyaml
      OVERALL=0
      for DIR in $DIRS; do
        echo "[python-test] 在 $DIR 安装依赖并运行 pytest"
        (
          cd "$DIR"
          [ -f requirements.txt ] && pip install -q -r requirements.txt
          [ -f pyproject.toml ] && pip install -q -e ".[test]" 2>/dev/null || true
          python -m pytest --tb=short -q
        ) || OVERALL=1
      done
      echo "{\"status\": \"$([ $OVERALL -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-python-test-result.json
      exit $OVERALL
  artifacts:
    paths:
      - governance-python-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7c. Node.js/TypeScript 测试: 无 package.json 时跳过 ──────────────────────
governance:node-test:
  stage: governance
  image: node:20-slim
  only:
    - branches
    - merge_requests
  script:
    - |
      if [ "${GOVERNANCE_SKIP_NODE_TEST:-false}" = "true" ]; then
        echo "[node-test] GOVERNANCE_SKIP_NODE_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-node-test-result.json
        exit 0
      fi
      # 排除子包的 package.json（node_modules 及有父级 package.json 的子目录）
      DIRS=$(find . -maxdepth 3 -name "package.json" \
             -not -path "*/node_modules/*" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
      if [ -z "$DIRS" ]; then
        echo "[node-test] 未找到 package.json, 跳过 Node.js 测试。"
        echo "{\"status\": \"skip\"}" > governance-node-test-result.json
        exit 0
      fi
      OVERALL=0
      for DIR in $DIRS; do
        echo "[node-test] 在 $DIR 运行 npm test"
        (
          cd "$DIR"
          npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
          npm test
        ) || OVERALL=1
      done
      echo "{\"status\": \"$([ $OVERALL -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-node-test-result.json
      exit $OVERALL
  artifacts:
    paths:
      - governance-node-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7d. Java 测试: 无 pom.xml / build.gradle 时跳过 ─────────────────────────
governance:java-test:
  stage: governance
  image: maven:3.9-eclipse-temurin-21
  only:
    - branches
    - merge_requests
  script:
    - |
      if [ "${GOVERNANCE_SKIP_JAVA_TEST:-false}" = "true" ]; then
        echo "[java-test] GOVERNANCE_SKIP_JAVA_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-java-test-result.json
        exit 0
      fi
      DIRS=$(find . -maxdepth 3 \( -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
             -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
      if [ -z "$DIRS" ]; then
        echo "[java-test] 未找到 pom.xml / build.gradle, 跳过 Java 测试。"
        echo "{\"status\": \"skip\"}" > governance-java-test-result.json
        exit 0
      fi
      OVERALL=0
      for DIR in $DIRS; do
        echo "[java-test] 在 $DIR 运行测试"
        (
          cd "$DIR"
          if [ -f pom.xml ]; then
            mvn -q test -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./gradlew test --console=plain -q 2>/dev/null || gradle test --console=plain -q
          fi
        ) || OVERALL=1
      done
      echo "{\"status\": \"$([ $OVERALL -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-java-test-result.json
      exit $OVERALL
  artifacts:
    paths:
      - governance-java-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7e. .NET/C# 测试: 无 .sln / .csproj 时跳过 ──────────────────────────────
governance:dotnet-test:
  stage: governance
  image: mcr.microsoft.com/dotnet/sdk:8.0
  only:
    - branches
    - merge_requests
  script:
    - |
      if [ "${GOVERNANCE_SKIP_DOTNET_TEST:-false}" = "true" ]; then
        echo "[dotnet-test] GOVERNANCE_SKIP_DOTNET_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-dotnet-test-result.json
        exit 0
      fi
      SLN=$(find . -maxdepth 3 -name "*.sln" -not -path "*/.*" | head -1)
      if [ -n "$SLN" ]; then
        echo "[dotnet-test] 使用 solution: $SLN"
        dotnet test "$SLN" --verbosity quiet
        EXIT_CODE=$?
      elif find . -maxdepth 3 -name "*.csproj" -not -path "*/.*" | grep -q .; then
        echo "[dotnet-test] 未找到 .sln，逐 .csproj 运行测试"
        OVERALL=0
        for PROJ in $(find . -maxdepth 3 -name "*.csproj" -not -path "*/.*"); do
          dotnet test "$PROJ" --verbosity quiet || OVERALL=1
        done
        EXIT_CODE=$OVERALL
      else
        echo "[dotnet-test] 未找到 .sln / .csproj, 跳过 .NET 测试。"
        echo "{\"status\": \"skip\"}" > governance-dotnet-test-result.json
        exit 0
      fi
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-dotnet-test-result.json
      exit $EXIT_CODE
  artifacts:
    paths:
      - governance-dotnet-test-result.json
    expire_in: 1 day
  allow_failure: false

# ── 7f. Rust 测试: 无 Cargo.toml 时跳过 ─────────────────────────────────────
governance:rust-test:
  stage: governance
  image: rust:1.78-slim
  only:
    - branches
    - merge_requests
  script:
    - |
      if [ "${GOVERNANCE_SKIP_RUST_TEST:-false}" = "true" ]; then
        echo "[rust-test] GOVERNANCE_SKIP_RUST_TEST=true, skip."
        echo "{\"status\": \"skip\"}" > governance-rust-test-result.json
        exit 0
      fi
      # workspace 根的 Cargo.toml 包含所有成员，直接在根跑即可覆盖所有 crate
      ROOT_CARGO=$(find . -maxdepth 1 -name "Cargo.toml" | head -1)
      if [ -n "$ROOT_CARGO" ]; then
        echo "[rust-test] 在根目录运行 cargo test（含 workspace 成员）"
        cargo test --quiet 2>&1
        EXIT_CODE=$?
      else
        DIRS=$(find . -maxdepth 3 -name "Cargo.toml" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
        if [ -z "$DIRS" ]; then
          echo "[rust-test] 未找到 Cargo.toml, 跳过 Rust 测试。"
          echo "{\"status\": \"skip\"}" > governance-rust-test-result.json
          exit 0
        fi
        OVERALL=0
        for DIR in $DIRS; do
          echo "[rust-test] 在 $DIR 运行 cargo test"
          (cd "$DIR" && cargo test --quiet 2>&1) || OVERALL=1
        done
        EXIT_CODE=$OVERALL
      fi
      echo "{\"status\": \"$([ $EXIT_CODE -eq 0 ] && echo 'pass' || echo 'fail')\"}" \
        > governance-rust-test-result.json
      exit $EXIT_CODE

# ── 8. GateResult 决策: 汇总 CI 独立证据, 不直接合并 ─────────────────────────
governance:gate-decision:
  stage: test
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - merge_requests
  variables:
    GIT_DEPTH: 0
  dependencies:
    - governance:risk-scan
    - governance:secret-scan
    - governance:mr-validate
    - governance:test-check
    - governance:go-test
    - governance:flutter-test
    - governance:python-test
    - governance:node-test
    - governance:java-test
    - governance:dotnet-test
    - governance:rust-test
  before_script:
    - git --version
    - python --version
    - python -c "import yaml; print('pyyaml ok')"
  script:
    - |
      TB="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-${CI_DEFAULT_BRANCH:-master}}"
      git fetch -q origin "$TB"
      SOURCE_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}"
      TARGET_SHA="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-$(git rev-parse "origin/$TB")}"
      CONFIG_PATH="${GOVERNANCE_CONFIG_PATH:-governance.config.yml}"
      [ -f "$CONFIG_PATH" ] || CONFIG_PATH="governance/governance.config.yml"
      POLICY_SHA="$(git rev-parse "${SOURCE_SHA}:${CONFIG_PATH}" 2>/dev/null || echo "$SOURCE_SHA")"
      python - <<'PY' > gate-evidence.json
      import json
      import os

      def read_check_result(name):
          """读取前置 job 的结果文件，返回 pass/fail/skip/missing"""
          path = f"governance-{name}-result.json"
          if not os.path.exists(path):
              return "missing"
          try:
              with open(path, "r") as f:
                  data = json.load(f)
                  return data.get("status", "missing")
          except Exception as e:
              print(f"[gate-decision] 警告: 无法解析 {path}: {e}", file=sys.stderr)
              return "missing"

      checks = {
          "risk-scan":   read_check_result("risk-scan"),
          "secret-scan": read_check_result("secret-scan"),
          "mr-validate": read_check_result("mr-validate"),
          "test-check":  read_check_result("test-check"),
          "go-test":     read_check_result("go-test"),
      }

      import sys
      print(f"[gate-decision] 各检查结果: {checks}", file=sys.stderr)
      print(json.dumps({"checks": checks}, ensure_ascii=False))
      PY
      set +e
      python governance/scripts/gate_decision.py \
        --evidence gate-evidence.json \
        --source-sha "$SOURCE_SHA" \
        --target-sha "$TARGET_SHA" \
        --policy-sha "$POLICY_SHA" \
        --diff-base "origin/$TB" \
        --target-branch "$TB" \
        --config "$CONFIG_PATH" \
        --output gate-result.json
      DECISION_EXIT=$?
      set -e
      if [ "$DECISION_EXIT" -gt 1 ]; then
        exit "$DECISION_EXIT"
      fi
  artifacts:
    paths:
      - gate-result.json
    expire_in: 30 days
  allow_failure: false

# ── 8. Merge Bot: 仅消费 GateResult, 使用独立 token 设置 GitLab 自动合并 ─────
governance:auto-merge:
  stage: test
  image: "$GOVERNANCE_PY_IMAGE"
  only:
    - merge_requests
  dependencies:
    - governance:gate-decision
  script:
    - |
      python - <<'PY'
      import json
      import os
      import sys
      import urllib.parse
      import urllib.request

      with open("gate-result.json", encoding="utf-8") as f:
          gate = json.load(f)

      action = gate.get("merge_action", "BLOCK")
      result = gate.get("result", "FAIL")
      if action != "AUTO_MERGE":
          print(f"[auto-merge] GateResult={result}, action={action}; skip.")
          raise SystemExit(0)

      if os.getenv("CI_MERGE_REQUEST_SOURCE_PROJECT_ID", os.getenv("CI_PROJECT_ID")) != os.getenv("CI_PROJECT_ID"):
          print("[auto-merge] fork/source-project MR is not eligible for bot merge.")
          raise SystemExit(0)

      token = os.getenv("GOVERNANCE_MERGE_BOT_TOKEN")
      if not token:
          print("[auto-merge] GOVERNANCE_MERGE_BOT_TOKEN is required for GitLab auto merge.", file=sys.stderr)
          raise SystemExit(1)

      api = "{}/projects/{}/merge_requests/{}/merge".format(
          os.environ["CI_API_V4_URL"].rstrip("/"),
          os.environ["CI_PROJECT_ID"],
          os.environ["CI_MERGE_REQUEST_IID"],
      )
      data = urllib.parse.urlencode({
          "merge_when_pipeline_succeeds": "true",
          "squash": "true",
          "should_remove_source_branch": "true",
