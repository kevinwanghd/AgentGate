# AgentGate 治理门禁 (GitHub Actions 版 — 自举: 本仓库用自己的规范管自己)
#
# 这是把 ci/governance-ci.yml (GitLab CI 语法) 翻译成 GitHub Actions 的版本。
# 本仓库脚本在根级 scripts/, 故调用路径为 scripts/xxx.py (非 governance/scripts/)。
#
# 软门禁(mr-validate / test-check): enforcement:hard, 第一天起即阻断 (新仓库无历史包袱)。
# 硬门禁(risk-scan / secret-scan): 第一天起即阻断。
#
# ┌──────────────────────────────────────────────────────────────┐
# │ 硬约束: 严格只扫 PR 增量 (base..HEAD), 任何情况都不全量扫描。      │
# │ - 只在 pull_request 触发, 用目标分支最新 tip (origin/base.ref) 算 diff。│
# │ - 不在 push 触发 (push 无 base, 会退化成 HEAD~1 等不可控范围)。   │
# │ - 不含 report_expired (它用 os.walk 全树遍历, 只能定时单独跑)。   │
# └──────────────────────────────────────────────────────────────┘
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # 风险扫描: 硬阻断 (命中风险模式且缺合法注解 → 拒合)
  risk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需完整历史以算 diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: scan risks
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          # 用目标分支最新 tip 作 base (而非 PR 创建时的旧快照 base.sha),
          # 否则 pull/merge 进来的他人改动会被误算进本次 diff。三点 diff 自动取 merge-base。
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描 (不允许全量回退)"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python scripts/scan_risks.py --diff-base "origin/$BASE_REF" --config governance.config.yml

  # 密钥扫描: 硬阻断
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (本次 PR 范围)
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --log-opts="origin/${BASE_REF}..HEAD" \
            --redact --no-banner --verbose

  # MR 描述校验: 硬门禁 (从 PR body 读 + commit trailer 读 AI-Usage)
  mr-validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          # 如果 PR_BODY 为空，创建临时文件写入提示信息（避免 stdin 为空导致脚本报错）
          if [ -z "$PR_BODY" ]; then
            echo "## 背景" > /tmp/pr_body.txt
            echo "请填写 PR 背景" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 变更内容" >> /tmp/pr_body.txt
            echo "请填写变更内容" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 自测确认" >> /tmp/pr_body.txt
            echo "[ ] 已完成自测" >> /tmp/pr_body.txt
            python scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml --file /tmp/pr_body.txt
          else
            printf '%s' "$PR_BODY" \
              | python scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml
          fi

  # 测试痕迹检测: 硬门禁 (失败测试记录无条件硬拦); 读 commit 的 Tested: trailer
  test-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: check tested
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python scripts/check_tested.py --diff-base "origin/$BASE_REF" --config governance.config.yml

  # Go 受影响包测试 (含反向依赖一跳扩展)
  # 跳过条件: 仓库无 go.mod (非 Go 仓库), 或 vars.GOVERNANCE_SKIP_GO_TEST == "true"
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: run affected go tests
        env:
          GOVERNANCE_SKIP_GO_TEST: ${{ vars.GOVERNANCE_SKIP_GO_TEST }}
          GOVERNANCE_GO_TEST_TIMEOUT: ${{ vars.GOVERNANCE_GO_TEST_TIMEOUT }}
        run: |
          if [ "${GOVERNANCE_SKIP_GO_TEST}" = "true" ]; then
            echo "[go-test] GOVERNANCE_SKIP_GO_TEST=true, 跳过。"
            exit 0
          fi
          if [ ! -f go.mod ]; then
            echo "[go-test] 未找到 go.mod, 跳过 Go 测试。"
            exit 0
          fi
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python scripts/run_affected_tests.py \
            --diff-base "origin/$BASE_REF" \
            --timeout "${GOVERNANCE_GO_TEST_TIMEOUT:-120}"

  # Flutter/Dart 测试: 无 pubspec.yaml 时自动跳过
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: run flutter tests
        env:
          GOVERNANCE_SKIP_FLUTTER_TEST: ${{ vars.GOVERNANCE_SKIP_FLUTTER_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_FLUTTER_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | xargs -I{} dirname {} 2>/dev/null)
          if [ -z "$DIRS" ]; then echo "[flutter-test] 未找到 pubspec.yaml, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[flutter-test] 在 $DIR 运行 flutter test"
            (cd "$DIR" && flutter pub get && flutter test) || OVERALL=1
          done
          exit $OVERALL

  # Python 测试: 无 requirements.txt / pyproject.toml / setup.py 时跳过
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run python tests
        env:
          GOVERNANCE_SKIP_PYTHON_TEST: ${{ vars.GOVERNANCE_SKIP_PYTHON_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_PYTHON_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) \
                 -not -path "*/.*" -not -path "*/node_modules/*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[python-test] 未找到 Python 项目标记文件, 跳过。"; exit 0; fi
          pip install -q pytest pyyaml
          OVERALL=0
          for DIR in $DIRS; do
            echo "[python-test] 在 $DIR 运行 pytest"
            (
              cd "$DIR"
              [ -f requirements.txt ] && pip install -q -r requirements.txt
              [ -f pyproject.toml ] && pip install -q -e ".[test]" 2>/dev/null || true
              python -m pytest --tb=short -q
            ) || OVERALL=1
          done
          exit $OVERALL

  # Node.js/TypeScript 测试: 无 package.json 时跳过
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run node tests
        env:
          GOVERNANCE_SKIP_NODE_TEST: ${{ vars.GOVERNANCE_SKIP_NODE_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_NODE_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 -name "package.json" \
                 -not -path "*/node_modules/*" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[node-test] 未找到 package.json, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[node-test] 在 $DIR 运行 npm test"
            (
              cd "$DIR"
              npm ci --prefer-offline --no-audit 2>/dev/null || npm install --no-audit
              npm test
            ) || OVERALL=1
          done
          exit $OVERALL

  # Java 测试: 无 pom.xml / build.gradle 时跳过
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: run java tests
        env:
          GOVERNANCE_SKIP_JAVA_TEST: ${{ vars.GOVERNANCE_SKIP_JAVA_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_JAVA_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 \( -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
                 -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[java-test] 未找到 pom.xml / build.gradle, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[java-test] 在 $DIR 运行测试"
            (
              cd "$DIR"
              if [ -f pom.xml ]; then
                mvn -q test -Dsurefire.failIfNoSpecifiedTests=false
              else
                ./gradlew test --console=plain -q 2>/dev/null || gradle test --console=plain -q
              fi
            ) || OVERALL=1
          done
          exit $OVERALL

  # .NET/C# 测试: 无 .sln / .csproj 时跳过
  dotnet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: run dotnet tests
        env:
          GOVERNANCE_SKIP_DOTNET_TEST: ${{ vars.GOVERNANCE_SKIP_DOTNET_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_DOTNET_TEST}" = "true" ]; then exit 0; fi
          SLN=$(find . -maxdepth 3 -name "*.sln" -not -path "*/.*" | head -1)
          if [ -n "$SLN" ]; then
            dotnet test "$SLN" --verbosity quiet
          elif find . -maxdepth 3 -name "*.csproj" -not -path "*/.*" | grep -q .; then
            OVERALL=0
            for PROJ in $(find . -maxdepth 3 -name "*.csproj" -not -path "*/.*"); do
              dotnet test "$PROJ" --verbosity quiet || OVERALL=1
            done
            exit $OVERALL
          else
            echo "[dotnet-test] 未找到 .sln / .csproj, 跳过。"
            exit 0
          fi

  # Rust 测试: 无 Cargo.toml 时跳过
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: run rust tests
        env:
          GOVERNANCE_SKIP_RUST_TEST: ${{ vars.GOVERNANCE_SKIP_RUST_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_RUST_TEST}" = "true" ]; then exit 0; fi
          ROOT_CARGO=$(find . -maxdepth 1 -name "Cargo.toml" | head -1)
          if [ -n "$ROOT_CARGO" ]; then
            echo "[rust-test] 在根目录运行 cargo test（含 workspace 成员）"
            cargo test --quiet
          else
            DIRS=$(find . -maxdepth 3 -name "Cargo.toml" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
            if [ -z "$DIRS" ]; then echo "[rust-test] 未找到 Cargo.toml, 跳过。"; exit 0; fi
            OVERALL=0
            for DIR in $DIRS; do
              echo "[rust-test] 在 $DIR 运行 cargo test"
              (cd "$DIR" && cargo test --quiet) || OVERALL=1
            done
            exit $OVERALL
          fi

  # 自测: 跑 governance 脚本自己的完整回归套件
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: run selftest
        run: bash scripts/selftest.sh

  # GateResult 汇总器（只读阶段）。
  # 只有该 job 成功后，后续独立 Merge Bot 才能申请平台自动合并。
  gate-decision:
    needs: [risk-scan, secret-scan, mr-validate, test-check, go-test, flutter-test, python-test, node-test, java-test, dotnet-test, rust-test, selftest]
    if: github.event.pull_request.draft == false
    outputs:
      merge_action: ${{ steps.compute.outputs.merge_action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pyyaml==6.0.3
      - name: compute GateResult v2
        id: compute
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          git cat-file -e "$HEAD_SHA^{commit}"
          SOURCE_SHA="$HEAD_SHA"
          POLICY_SHA="$(git rev-parse "${SOURCE_SHA}:governance.config.yml")"
          cat > /tmp/agentgate-evidence.json <<'JSON'
          {"schema_version":"v1","checks":{"risk-scan":"pass","secret-scan":"pass","mr-validate":"pass","test-check":"pass","go-test":"pass","selftest":"pass"}}
          JSON
          set +e
          python scripts/gate_decision.py \
            --evidence /tmp/agentgate-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --target-sha "$BASE_SHA" \
            --policy-sha "$POLICY_SHA" \
            --diff-base "origin/$BASE_REF" \
            --config governance.config.yml \
            --output gate-result.json
          DECISION_EXIT=$?
          set -e
          if [ "$DECISION_EXIT" -gt 1 ]; then
            echo "GateResult 计算错误，拒绝继续。"
            exit "$DECISION_EXIT"
          fi
          MERGE_ACTION="$(python -c 'import json; print(json.load(open("gate-result.json", encoding="utf-8"))["merge_action"])')"
          echo "merge_action=$MERGE_ACTION" >> "$GITHUB_OUTPUT"
          echo "GateResult:"; cat gate-result.json

  # Merge Bot：只在 GateResult 成功后启用平台自动合并。
  # 开发 agent、测试 runner 和 Gate Controller 均不直接获得该权限。
  auto-merge:
    needs: [gate-decision]
    if: >-
      needs.gate-decision.result == 'success' &&
      needs.gate-decision.outputs.merge_action == 'AUTO_MERGE' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
