# AgentGate 治理门禁 (GitHub Actions 版 — 自举: 本仓库用自己的规范管自己)
#
# 这是把 ci/governance-ci.yml (GitLab CI 语法) 翻译成 GitHub Actions 的版本。
# 本仓库脚本在根级 scripts/, 故调用路径为 scripts/xxx.py (非 governance/scripts/)。
#
# 软门禁(mr-validate / test-check): enforcement:hard, 第一天起即阻断 (新仓库无历史包袱)。
# 硬门禁(risk-scan / secret-scan): 第一天起即阻断。
#
# ┌──────────────────────────────────────────────────────────────┐
# │ 硬约束: 严格只扫 PR 增量 (base..HEAD), 任何情况都不全量扫描。      │
# │ - 只在 pull_request 触发, 用目标分支最新 tip (origin/base.ref) 算 diff。│
# │ - 不在 push 触发 (push 无 base, 会退化成 HEAD~1 等不可控范围)。   │
# │ - 不含 report_expired (它用 os.walk 全树遍历, 只能定时单独跑)。   │
# └──────────────────────────────────────────────────────────────┘
#
# CI 优化 (2026-09): P0-A 共享 checkout artifact + P0-B shallow fetch
# - checkout job 统一拉取代码，所有 scan job 通过 artifact 复用
# - fetch-depth: 1 + shallow fetch 目标分支，节省 50~80% checkout 时间
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # P1-A: Change Detection — 轻量 path filter，决定后续 scan job 是否需要运行
  # 每个 scan job 独立 checkout 完整历史（artifact 方案有 zip 压缩 bug）
  path-filter:
    runs-on: ubuntu-latest
    outputs:
      run_yaml_validate: ${{ steps.filter.outputs.run_yaml_validate }}
      run_risk_scan: ${{ steps.filter.outputs.run_risk_scan }}
      run_secret_scan: ${{ steps.filter.outputs.run_secret_scan }}
      run_mr_validate: ${{ steps.filter.outputs.run_mr_validate }}
      run_test_check: ${{ steps.filter.outputs.run_test_check }}
      run_go_test: ${{ steps.filter.outputs.run_go_test }}
      run_flutter_test: ${{ steps.filter.outputs.run_flutter_test }}
      run_python_test: ${{ steps.filter.outputs.run_python_test }}
      run_node_test: ${{ steps.filter.outputs.run_node_test }}
      run_java_test: ${{ steps.filter.outputs.run_java_test }}
      run_dotnet_test: ${{ steps.filter.outputs.run_dotnet_test }}
      run_rust_test: ${{ steps.filter.outputs.run_rust_test }}
      changed_files: ${{ steps.filter.outputs.changed_files }}
    steps:
      # P0-B: shallow fetch (path-filter 只需当前 commit + base tip)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch base ref (shallow)
        id: vars
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "[path-filter] BASE_REF=$BASE_REF"
          # shallow fetch base ref (只需最新 tip，不需完整历史)
          git fetch -q --depth=1 origin "$BASE_REF" 2>/dev/null || git fetch -q origin "$BASE_REF"
      - name: Detect changed paths
        id: filter
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          echo "[path-filter] Using BASE_REF=$BASE_REF"

          # 捕获 git diff 输出
          CHANGED=""
          if git rev-parse "origin/$BASE_REF" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD" 2>/dev/null || echo "")
          fi
          if [ -z "$CHANGED" ]; then
            # 回退: 直接用 base ref 前缀尝试
            CHANGED=$(git diff --name-only "$BASE_REF...HEAD" 2>/dev/null || echo "")
          fi
          # 多行输出必须用 heredoc 语法，裸换行写入 GITHUB_OUTPUT 会报错
          {
            echo 'changed_files<<CHANGED_EOF'
            echo "$CHANGED"
            echo 'CHANGED_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "[path-filter] Changed files: $CHANGED"

          # ── YAML 验证: .yml / .yaml 文件变化时触发 ──────────────────
          if echo "$CHANGED" | grep -qE '\.yml$|\.yaml$'; then
            echo "run_yaml_validate=true" >> $GITHUB_OUTPUT
          else
            echo "run_yaml_validate=false" >> $GITHUB_OUTPUT
          fi

          # ── 风险扫描: 生产代码 ─────────────────────────────────────
          if echo "$CHANGED" | grep -qE '\.py$|\.ts$|\.tsx$|\.js$|\.jsx$|\.go$|\.java$|\.cs$|\.rs$|\.dart$|\.kt$|\.swift$|\.c$|\.cpp$|\.h$|\.scala$|\.rb$|\.php$'; then
            echo "run_risk_scan=true" >> $GITHUB_OUTPUT
          else
            echo "run_risk_scan=false" >> $GITHUB_OUTPUT
          fi

          # ── 密钥扫描: 代码 + 配置 + 脚本 ───────────────────────────
          if echo "$CHANGED" | grep -qE '\.py$|\.ts$|\.tsx$|\.js$|\.jsx$|\.go$|\.java$|\.cs$|\.rs$|\.dart$|\.yml$|\.yaml$|\.json$|\.toml$|\.xml$|\.sh$|\.bash$|\.ps1$|\.tf$|\.env|\.ini$|\.conf$|\.config$|\.gradle$|\.properties$'; then
            echo "run_secret_scan=true" >> $GITHUB_OUTPUT
          else
            echo "run_secret_scan=false" >> $GITHUB_OUTPUT
          fi

          # ── MR 描述校验: 任何代码/文档变化都触发 ──────────────────
          if echo "$CHANGED" | grep -qE '.*'; then
            echo "run_mr_validate=true" >> $GITHUB_OUTPUT
          else
            echo "run_mr_validate=false" >> $GITHUB_OUTPUT
          fi

          # ── 测试检查: 测试文件 + 生产代码变化 ─────────────────────
          if echo "$CHANGED" | grep -qE '_test\.py$|test_.*\.py$|\.test\.ts$|\.spec\.ts$|\.test\.js$|\.spec\.js$|test_.*\.go$|_test\.go$|\.test\.dart$|\.spec\.dart$|\.test\.rs$|\.spec\.rs$|\.test\.java$|\.Test\.java$|\.test\.cs$|\.Test\.cs$|conftest\.py$|pytest\.ini$|tox\.ini$|setup\.cfg$'; then
            echo "run_test_check=true" >> $GITHUB_OUTPUT
          elif echo "$CHANGED" | grep -qE '\.py$|\.ts$|\.tsx$|\.js$|\.jsx$|\.go$|\.java$|\.cs$|\.rs$|\.dart$'; then
            echo "run_test_check=true" >> $GITHUB_OUTPUT
          else
            echo "run_test_check=false" >> $GITHUB_OUTPUT
          fi

          # ── 语言测试: 各语言源文件变化 ─────────────────────────────
          # Go
          echo "$CHANGED" | grep -qE '\.go$' && echo "run_go_test=true" >> $GITHUB_OUTPUT || echo "run_go_test=false" >> $GITHUB_OUTPUT
          # Flutter/Dart
          echo "$CHANGED" | grep -qE '\.dart$|\.yaml$' && echo "run_flutter_test=true" >> $GITHUB_OUTPUT || echo "run_flutter_test=false" >> $GITHUB_OUTPUT
          # Python
          echo "$CHANGED" | grep -qE '\.py$' && echo "run_python_test=true" >> $GITHUB_OUTPUT || echo "run_python_test=false" >> $GITHUB_OUTPUT
          # Node.js
          echo "$CHANGED" | grep -qE '\.js$|\.ts$|\.jsx$|\.tsx$' && echo "run_node_test=true" >> $GITHUB_OUTPUT || echo "run_node_test=false" >> $GITHUB_OUTPUT
          # Java
          echo "$CHANGED" | grep -qE '\.java$|\.gradle$' && echo "run_java_test=true" >> $GITHUB_OUTPUT || echo "run_java_test=false" >> $GITHUB_OUTPUT
          # .NET
          echo "$CHANGED" | grep -qE '\.cs$|\.csproj$|\.sln$' && echo "run_dotnet_test=true" >> $GITHUB_OUTPUT || echo "run_dotnet_test=false" >> $GITHUB_OUTPUT
          # Rust
          echo "$CHANGED" | grep -qE '\.rs$|\.toml$' && echo "run_rust_test=true" >> $GITHUB_OUTPUT || echo "run_rust_test=false" >> $GITHUB_OUTPUT

  # (已移除 scan-compound: 它与 risk-scan/secret-scan/mr-validate 三个独立 job 完全重复,
  #  每个 PR 把同样的扫描跑两遍; 分支保护要求的是独立 job 名, 故保留独立 job。
  #  governance_scan_all.py 仍可用于本地一次性检查。)

  # YAML 配置语法检查: 最先运行，快速失败
  yaml-validate:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_yaml_validate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: validate YAML config files
        run: python3 scripts/validate_yaml.py --ci
      - name: validate hard lessons
        run: python3 scripts/validate_lessons.py --root .
      - name: validate pending lessons schema
        run: python3 scripts/pending_lessons_schema.py

  # 风险扫描: 硬阻断 (命中风险模式且缺合法注解 → 拒合)
  risk-scan:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_risk_scan == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: scan risks
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          # 用目标分支最新 tip 作 base (而非 PR 创建时的旧快照 base.sha),
          # 否则 pull/merge 进来的他人改动会被误算进本次 diff。三点 diff 自动取 merge-base。
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描 (不允许全量回退)"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 scripts/scan_risks.py --diff-base "origin/$BASE_REF" --config governance.config.yml

  # 密钥扫描: 硬阻断
  secret-scan:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_secret_scan == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan introduced secrets (standard library)
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 scripts/scan_secrets.py --diff-base "origin/${BASE_REF}"

  # MR 描述校验: 硬门禁 (从 PR body 读 + commit trailer 读 AI-Usage)
  mr-validate:
    needs: [path-filter]
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.run_mr_validate == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          # 如果 PR_BODY 为空，创建临时文件写入提示信息（避免 stdin 为空导致脚本报错）
          if [ -z "$PR_BODY" ]; then
            echo "## 背景" > /tmp/pr_body.txt
            echo "请填写 PR 背景" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 变更内容" >> /tmp/pr_body.txt
            echo "请填写变更内容" >> /tmp/pr_body.txt
            echo "" >> /tmp/pr_body.txt
            echo "## 自测确认" >> /tmp/pr_body.txt
            echo "[ ] 已完成自测" >> /tmp/pr_body.txt
            python3 scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml --file /tmp/pr_body.txt
          else
            printf '%s' "$PR_BODY" \
              | python3 scripts/validate_mr.py --diff-base "origin/$BASE_REF" --config governance.config.yml
          fi

  # 测试痕迹检测: 硬门禁 (失败测试记录无条件硬拦)
  # AgentGate 是工具包仓库，无语言项目 → 直接跑 selftest.sh 生成 evidence
  # (不用 language-specific jobs artifact，因为 python-test/dotnet-test 等被跳过)
  test-check:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_test_check == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: generate test evidence via selftest
        run: |
          set -euo pipefail
          mkdir -p .governance
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch -q origin "$BASE_REF"
          python3 scripts/record_test_run.py \
            --evidence .governance/test-evidence.jsonl \
            --tool "selftest" \
            -- bash scripts/selftest.sh
      - name: check tested
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          python3 scripts/check_tested.py \
            --diff-base "origin/$BASE_REF" \
            --config governance.config.yml \
            --ci-mode

  # Go 受影响包测试 (含反向依赖一跳扩展)
  # 跳过条件: 仓库无 go.mod (非 Go 仓库), 或 vars.GOVERNANCE_SKIP_GO_TEST == "true"
  go-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_go_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Go module
        id: gomod
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # 无 go.mod 的仓库不下载 Go 工具链
      - uses: actions/setup-go@v5
        if: steps.gomod.outputs.present == 'true'
        with:
          go-version: "1.22"
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: run affected go tests
        env:
          GOVERNANCE_SKIP_GO_TEST: ${{ vars.GOVERNANCE_SKIP_GO_TEST }}
          GOVERNANCE_GO_TEST_TIMEOUT: ${{ vars.GOVERNANCE_GO_TEST_TIMEOUT }}
        run: |
          if [ "${GOVERNANCE_SKIP_GO_TEST}" = "true" ]; then
            echo "[go-test] GOVERNANCE_SKIP_GO_TEST=true, 跳过。"
            exit 0
          fi
          if [ ! -f go.mod ]; then
            echo "[go-test] 未找到 go.mod, 跳过 Go 测试。"
            exit 0
          fi
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::PR base.ref 缺失, 拒绝扫描"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 scripts/run_affected_tests.py \
            --diff-base "origin/$BASE_REF" \
            --timeout "${GOVERNANCE_GO_TEST_TIMEOUT:-120}"

  # Flutter/Dart 测试: 无 pubspec.yaml 时自动跳过
  flutter-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_flutter_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: run flutter tests
        env:
          GOVERNANCE_SKIP_FLUTTER_TEST: ${{ vars.GOVERNANCE_SKIP_FLUTTER_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_FLUTTER_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "*/.*" | xargs -I{} dirname {} 2>/dev/null)
          if [ -z "$DIRS" ]; then echo "[flutter-test] 未找到 pubspec.yaml, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[flutter-test] 在 $DIR 运行 flutter test"
            (cd "$DIR" && flutter test) || OVERALL=1
          done
          exit $OVERALL

  # Python 测试: 无 requirements.txt / pyproject.toml / setup.py 时跳过
  # 记录证据到 .governance/test-evidence.jsonl（被 test-check 验证）
  python-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_python_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: run python tests with evidence recording
        env:
          GOVERNANCE_SKIP_PYTHON_TEST: ${{ vars.GOVERNANCE_SKIP_PYTHON_TEST }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${GOVERNANCE_SKIP_PYTHON_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 \( -name "requirements.txt" -o -name "pyproject.toml" -o -name "setup.py" \) \
                 -not -path "*/.*" -not -path "*/node_modules/*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[python-test] 未找到 Python 项目标记文件, 跳过。"; exit 0; fi
          TEST_DIRS=""
          for DIR in $DIRS; do
            if find "$DIR" -maxdepth 2 \( -name "pytest.ini" -o -name "tox.ini" -o -name "setup.cfg" \) -print -quit | grep -q . || \
               grep -Eiq "pytest" "$DIR"/requirements*.txt "$DIR"/pyproject.toml "$DIR"/setup.py 2>/dev/null; then
              TEST_DIRS="$TEST_DIRS $DIR"
            fi
          done
          if [ -z "$TEST_DIRS" ]; then echo "[python-test] 未找到 pytest 项目声明, 跳过。"; exit 0; fi
          command -v pytest >/dev/null 2>&1 || { echo "[python-test] pytest must be preinstalled" >&2; exit 1; }
          python3 -c "import yaml" || { echo "[python-test] pyyaml must be preinstalled" >&2; exit 1; }
          mkdir -p .governance
          OVERALL=0
          for DIR in $TEST_DIRS; do
            echo "[python-test] 在 $DIR 运行 pytest (记录证据)"
            (
              cd "$DIR"
              python3 "$GITHUB_WORKSPACE/scripts/record_test_run.py" \
                --evidence "$GITHUB_WORKSPACE/.governance/test-evidence.jsonl" \
                --tool "pytest" \
                -- python3 -m pytest --tb=short -q
            ) || OVERALL=1
          done
          exit $OVERALL
      - name: upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-evidence
          path: .governance/test-evidence.jsonl
          retention-days: 1


  # Node.js/TypeScript 测试: 无 package.json 时跳过
  node-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_node_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: run node tests
        env:
          GOVERNANCE_SKIP_NODE_TEST: ${{ vars.GOVERNANCE_SKIP_NODE_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_NODE_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 -name "package.json" \
                 -not -path "*/node_modules/*" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[node-test] 未找到 package.json, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[node-test] 在 $DIR 运行 npm test"
            (
              cd "$DIR"
              if [ -f package-lock.json ] && [ ! -d node_modules ]; then
                echo "[node-test] node_modules must be preinstalled in the runner image" >&2
                exit 1
              fi
              npm test
            ) || OVERALL=1
          done
          exit $OVERALL

  # Java 测试: 无 pom.xml / build.gradle 时跳过
  java-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_java_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: run java tests
        env:
          GOVERNANCE_SKIP_JAVA_TEST: ${{ vars.GOVERNANCE_SKIP_JAVA_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_JAVA_TEST}" = "true" ]; then exit 0; fi
          DIRS=$(find . -maxdepth 3 \( -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
                 -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
          if [ -z "$DIRS" ]; then echo "[java-test] 未找到 pom.xml / build.gradle, 跳过。"; exit 0; fi
          OVERALL=0
          for DIR in $DIRS; do
            echo "[java-test] 在 $DIR 运行测试"
            (
              cd "$DIR"
              if [ -f pom.xml ]; then
                mvn -q test -Dsurefire.failIfNoSpecifiedTests=false
              else
                ./gradlew test --console=plain -q 2>/dev/null || gradle test --console=plain -q
              fi
            ) || OVERALL=1
          done
          exit $OVERALL

  # .NET/C# 测试: 无 .sln / .csproj 时跳过
  # 记录证据到 .governance/test-evidence.jsonl（被 test-check 验证）
  dotnet-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_dotnet_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: run dotnet tests with evidence recording
        env:
          GOVERNANCE_SKIP_DOTNET_TEST: ${{ vars.GOVERNANCE_SKIP_DOTNET_TEST }}
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ "${GOVERNANCE_SKIP_DOTNET_TEST}" = "true" ]; then exit 0; fi
          SLN=$(find . -maxdepth 3 -name "*.sln" -not -path "*/.*" | head -1)
          TEST_PROJ=$(find . -maxdepth 3 -name "*.csproj" -not -path "*/.*" | head -1)
          if [ -z "$SLN" ] && [ -z "$TEST_PROJ" ]; then
            echo "[dotnet-test] 未找到 .sln / .csproj, 跳过。"
            exit 0
          fi
          mkdir -p .governance
          if [ -n "$SLN" ]; then
            echo "[dotnet-test] 运行 dotnet test $SLN (记录证据)"
            python3 "$GITHUB_WORKSPACE/scripts/record_test_run.py" \
              --evidence "$GITHUB_WORKSPACE/.governance/test-evidence.jsonl" \
              --tool "dotnet-test" \
              -- dotnet test "$SLN" --verbosity quiet
          else
            echo "[dotnet-test] 运行 dotnet test $TEST_PROJ (记录证据)"
            python3 "$GITHUB_WORKSPACE/scripts/record_test_run.py" \
              --evidence "$GITHUB_WORKSPACE/.governance/test-evidence.jsonl" \
              --tool "dotnet-test" \
              -- dotnet test "$TEST_PROJ" --verbosity quiet
          fi

  # Rust 测试: 无 Cargo.toml 时跳过
  rust-test:
    needs: [path-filter]
    if: ${{ needs.path-filter.outputs.run_rust_test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - name: run rust tests
        env:
          GOVERNANCE_SKIP_RUST_TEST: ${{ vars.GOVERNANCE_SKIP_RUST_TEST }}
        run: |
          if [ "${GOVERNANCE_SKIP_RUST_TEST}" = "true" ]; then exit 0; fi
          ROOT_CARGO=$(find . -maxdepth 1 -name "Cargo.toml" | head -1)
          if [ -n "$ROOT_CARGO" ]; then
            echo "[rust-test] 在根目录运行 cargo test（含 workspace 成员）"
            cargo test --quiet
          else
            DIRS=$(find . -maxdepth 3 -name "Cargo.toml" -not -path "*/.*" | xargs -I{} dirname {} | sort -u)
            if [ -z "$DIRS" ]; then echo "[rust-test] 未找到 Cargo.toml, 跳过。"; exit 0; fi
            OVERALL=0
            for DIR in $DIRS; do
              echo "[rust-test] 在 $DIR 运行 cargo test"
              (cd "$DIR" && cargo test --quiet) || OVERALL=1
            done
            exit $OVERALL
          fi

  # 自测: 跑 governance 脚本自己的完整回归套件
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: run selftest
        run: bash scripts/selftest.sh

  # GateResult 汇总器（只读阶段）。
  # 只有该 job 成功后，后续独立 Merge Bot 才能申请平台自动合并。
  # yaml-validate 是硬门禁，即使 path-filter 认为无需验证也必须跑（YAML 语法错误会导致其他扫描失效）。
  gate-decision:
    needs: [yaml-validate, risk-scan, secret-scan, mr-validate, test-check, go-test, flutter-test, python-test, node-test, java-test, dotnet-test, rust-test, selftest]
    if: ${{ always() && github.event.pull_request.draft == false }}
    outputs:
      merge_action: ${{ steps.compute.outputs.merge_action }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # gate-decision 需要读 policy SHA (git cat-file -e)，需要完整历史
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: compute GateResult v2
        id: compute
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RISK_SCAN: ${{ needs.risk-scan.result == 'success' && 'pass' || 'fail' }}
          SECRET_SCAN: ${{ needs.secret-scan.result == 'success' && 'pass' || 'fail' }}
          MR_VALIDATE: ${{ needs.mr-validate.result == 'success' && 'pass' || 'fail' }}
          TEST_CHECK: ${{ needs.test-check.result == 'success' && 'pass' || 'fail' }}
          GO_TEST: ${{ needs.go-test.result == 'success' && 'pass' || needs.go-test.result == 'skipped' && 'skip' || 'fail' }}
          FLUTTER_TEST: ${{ needs.flutter-test.result == 'success' && 'pass' || needs.flutter-test.result == 'skipped' && 'skip' || 'fail' }}
          PYTHON_TEST: ${{ needs.python-test.result == 'success' && 'pass' || needs.python-test.result == 'skipped' && 'skip' || 'fail' }}
          NODE_TEST: ${{ needs.node-test.result == 'success' && 'pass' || needs.node-test.result == 'skipped' && 'skip' || 'fail' }}
          JAVA_TEST: ${{ needs.java-test.result == 'success' && 'pass' || needs.java-test.result == 'skipped' && 'skip' || 'fail' }}
          DOTNET_TEST: ${{ needs.dotnet-test.result == 'success' && 'pass' || needs.dotnet-test.result == 'skipped' && 'skip' || 'fail' }}
          RUST_TEST: ${{ needs.rust-test.result == 'success' && 'pass' || needs.rust-test.result == 'skipped' && 'skip' || 'fail' }}
          SELFTEST: ${{ needs.selftest.result == 'success' && 'pass' || 'fail' }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          git cat-file -e "$HEAD_SHA^{commit}"
          SOURCE_SHA="$HEAD_SHA"
          POLICY_SHA="$(git rev-parse "${SOURCE_SHA}:governance.config.yml")"
          export POLICY_SHA
          python - <<'PY' > /tmp/agentgate-evidence.json
          import json
          import os

          checks = {
              "risk-scan": os.environ["RISK_SCAN"],
              "secret-scan": os.environ["SECRET_SCAN"],
              "mr-validate": os.environ["MR_VALIDATE"],
              "test-check": os.environ["TEST_CHECK"],
              "go-test": os.environ["GO_TEST"],
              "flutter-test": os.environ["FLUTTER_TEST"],
              "python-test": os.environ["PYTHON_TEST"],
              "node-test": os.environ["NODE_TEST"],
              "java-test": os.environ["JAVA_TEST"],
              "dotnet-test": os.environ["DOTNET_TEST"],
              "rust-test": os.environ["RUST_TEST"],
              "selftest": os.environ["SELFTEST"],
          }
          print(json.dumps({
              "schema_version": "agentgate.io/ci-evidence/v1",
              "source_sha": os.environ["HEAD_SHA"],
              "target_sha": os.environ["BASE_SHA"],
              "policy_sha": os.environ["POLICY_SHA"],
              "checks": checks,
          }, ensure_ascii=False))
          PY
          set +e
          python3 scripts/gate_decision.py \
            --evidence /tmp/agentgate-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --target-sha "$BASE_SHA" \
            --policy-sha "$POLICY_SHA" \
            --diff-base "origin/$BASE_REF" \
            --config governance.config.yml \
            --output gate-result.json
          DECISION_EXIT=$?
          set -e
          if [ "$DECISION_EXIT" -gt 1 ]; then
            echo "GateResult 计算错误，拒绝继续。"
            exit "$DECISION_EXIT"
          fi
          MERGE_ACTION="$(python3 -c 'import json; print(json.load(open("gate-result.json", encoding="utf-8"))["merge_action"])')"
          echo "merge_action=$MERGE_ACTION" >> "$GITHUB_OUTPUT"
          echo "GateResult:"; cat gate-result.json
          # 门禁决策处理：只有 BLOCK 才让 CI 失败
          # WAIT 和 MANUAL_MERGE 都是正常状态，只是阻止自动合并
          if [ "$MERGE_ACTION" = "BLOCK" ]; then
            echo "门禁决策: BLOCK — 立即阻断，禁止合并。"
            exit 1
          elif [ "$MERGE_ACTION" = "WAIT" ]; then
            echo "门禁决策: WAIT — 需人工审批，CI 通过，等待人工介入。"
          elif [ "$MERGE_ACTION" = "MANUAL_MERGE" ]; then
            echo "门禁决策: MANUAL_MERGE — 已禁用自动合并，请手动合并。"
          elif [ "$MERGE_ACTION" != "AUTO_MERGE" ]; then
            echo "门禁决策: $MERGE_ACTION，不允许自动合并。"
          fi

  # Merge Bot：只在 GateResult 成功后启用平台自动合并。
  # 开发 agent、测试 runner 和 Gate Controller 均不直接获得该权限。
  auto-merge:
    needs: [gate-decision]
    if: >-
      needs.gate-decision.result == 'success' &&
      needs.gate-decision.outputs.merge_action == 'AUTO_MERGE' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
