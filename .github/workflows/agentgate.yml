name: AgentGate

on:
  workflow_call:
    inputs:
      config-path:
        required: false
        type: string
        default: governance.config.yml
      agentgate-repository:
        required: false
        type: string
        default: kevinwanghd/AgentGate
      agentgate-ref:
        required: false
        type: string
        default: github-stable
      skip-go-test:
        required: false
        type: boolean
        default: false
      skip-auto-merge:
        required: false
        type: boolean
        default: false
    secrets:
      GOVERNANCE_MERGE_BOT_TOKEN:
        required: false
      AI_REVIEW_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  risk-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Scan risk annotations
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 .agentgate/scripts/scan_risks.py \
            --diff-base "origin/$BASE_REF" \
            --config "${{ inputs.config-path }}"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Scan introduced secrets (standard library)
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 .agentgate/scripts/scan_secrets.py --diff-base "origin/${BASE_REF}"

  mr-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          printf '%s' "$PR_BODY" \
            | python3 .agentgate/scripts/validate_mr.py \
                --diff-base "origin/$BASE_REF" \
                --config "${{ inputs.config-path }}"

  test-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Check test evidence
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 .agentgate/scripts/check_tested.py \
            --diff-base "origin/$BASE_REF" \
            --config "${{ inputs.config-path }}"

  go-test:
    if: ${{ !inputs.skip-go-test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Detect Go module
        id: gomod
        run: |
          if [ -f go.mod ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # 无 go.mod 的仓库不下载 Go 工具链 (节省 30~60s)
      - name: Set up Go
        if: steps.gomod.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Run affected Go tests
        env:
          GOVERNANCE_GO_TEST_TIMEOUT: ${{ vars.GOVERNANCE_GO_TEST_TIMEOUT }}
        run: |
          if [ ! -f go.mod ]; then
            echo "[go-test] go.mod not found, skipping."
            exit 0
          fi
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          python3 .agentgate/scripts/run_affected_tests.py \
            --diff-base "origin/$BASE_REF" \
            --timeout "${GOVERNANCE_GO_TEST_TIMEOUT:-120}"

  ai-review:
    # 草稿尚未送审：不花 AI 审查的钱；转正式后由 synchronize/ready_for_review 重新触发整轮。
    # review 提交（approve）后重跑，让 critical 审批能推动 gate 重新判定。
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      review: ${{ steps.review.outputs.review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Run AI review
        id: review
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "review=skip" >> "$GITHUB_OUTPUT"
            echo "不是 pull_request 事件，跳过 AI 审查"
            exit 0
          fi
          git fetch -q origin "$BASE_REF"
          # 本 job 按 head.sha 检出，origin/<base> 不一定存在；以 FETCH_HEAD 为准。
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          # 与 gate 策略一致：审查配置和要点都来自目标分支，PR 改不了自己的门禁。
          MODEL=""; POINTS=""; INTERNAL=""; BASE_URL=""
          if git cat-file -e "${TARGET_SHA}:${CONFIG_PATH}" 2>/dev/null; then
            git show "${TARGET_SHA}:${CONFIG_PATH}" > "$RUNNER_TEMP/review-policy.yml"
            eval "$(python3 - "$RUNNER_TEMP/review-policy.yml" <<'PY'
          import shlex
          import sys
          import yaml

          config = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          review = (config.get("auto_merge") or {}).get("ai_review") or {}
          values = {
              "MODEL": review.get("model") or "",
              "POINTS": review.get("points") or "",
              "INTERNAL": ",".join(review.get("internal") or []),
              "BASE_URL": review.get("base_url") or "",
          }
          print(" ".join(f"{key}={shlex.quote(str(value))}" for key, value in values.items()))
          PY
          )"
          fi
          if [ -z "$MODEL" ] || [ -z "$POINTS" ]; then
            echo "review=skip" >> "$GITHUB_OUTPUT"
            echo "目标分支未配置 auto_merge.ai_review，跳过 AI 审查"
            exit 0
          fi
          if ! git cat-file -e "${TARGET_SHA}:${POINTS}" 2>/dev/null; then
            echo "review=fail" >> "$GITHUB_OUTPUT"
            echo "::error::目标分支上没有审查要点文件 ${POINTS}"
            exit 1
          fi
          git show "${TARGET_SHA}:${POINTS}" > "$RUNNER_TEMP/review-points.md"
          # fail-closed：有 findings 或审查本身出错都判 fail，evidence 与 job 结果双通道记录
          set +e
          ARGS=(--base "origin/$BASE_REF" --head "$SOURCE_SHA"
                --points-file "$RUNNER_TEMP/review-points.md"
                --model "$MODEL" --output "$GITHUB_OUTPUT")
          [ -n "$INTERNAL" ] && ARGS+=(--internal "$INTERNAL")
          [ -n "$BASE_URL" ] && ARGS+=(--base-url "$BASE_URL")
          python3 .agentgate/scripts/ai_review.py "${ARGS[@]}"
          exit $?

  gate-decision:
    needs:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - go-test
      - ai-review
    # 草稿不判定：审查与 CI 等待都跳过，判 FAIL 只会误导；转正式后重跑整轮。
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      merge-action: ${{ steps.gate.outputs.merge_action }}
      result: ${{ steps.gate.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Count approvals
        id: approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$NUMBER" ]; then
            echo "approvals=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT="$(python3 .agentgate/scripts/count_approvals.py --repo "$GITHUB_REPOSITORY" --pr "$NUMBER")"
          echo "有效 approve：$COUNT"
          echo "approvals=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Wait for repository CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RISK_SCAN: ${{ needs.risk-scan.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          MR_VALIDATE: ${{ needs.mr-validate.result }}
          TEST_CHECK: ${{ needs.test-check.result }}
          GO_TEST: ${{ needs.go-test.result }}
          REVIEW: ${{ github.event.pull_request.draft && 'skip' || needs.ai-review.outputs.review || 'fail' }}
        run: |
          # 草稿还没送审：不占用 CI 等待时间；转正式后整轮重跑。
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "ci=skip" >> "$GITHUB_OUTPUT"
            echo "草稿 PR，跳过 CI 等待"
            exit 0
          fi
          # 前置检查已失败时不必再等 CI；跳过会让 evidence 记为 skip，由 required_checks 决定是否阻断。
          ALL_OK=true
          for RESULT in "$RISK_SCAN" "$SECRET_SCAN" "$MR_VALIDATE" "$TEST_CHECK" "$GO_TEST" "$REVIEW"; do
            case "$RESULT" in
              success|skipped|pass|skip) ;;
              *) ALL_OK=false ;;
            esac
          done
          if [ "$ALL_OK" != "true" ]; then
            echo "ci=skip" >> "$GITHUB_OUTPUT"
            echo "前置检查未全部通过，跳过 CI 等待"
            exit 0
          fi
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then
            echo "ci=skip" >> "$GITHUB_OUTPUT"
            echo "不是 pull_request 事件，跳过 CI 等待"
            exit 0
          fi
          git fetch -q origin "$BASE_REF"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          TARGET_SHA="$(git rev-parse "origin/$BASE_REF")"
          # 与 gate 策略一致：只从目标分支读 ci_workflows，PR 改不了自己的门禁。
          WORKFLOWS=""
          if git cat-file -e "${TARGET_SHA}:${CONFIG_PATH}" 2>/dev/null; then
            git show "${TARGET_SHA}:${CONFIG_PATH}" > "$RUNNER_TEMP/ci-policy.yml"
            WORKFLOWS="$(python3 - "$RUNNER_TEMP/ci-policy.yml" <<'PY'
          import sys
          import yaml

          config = yaml.safe_load(open(sys.argv[1], encoding="utf-8")) or {}
          auto = config.get("auto_merge") or {}
          workflows = auto.get("ci_workflows") or []
          if isinstance(workflows, str):
              workflows = [workflows]
          print(",".join(str(item).strip() for item in workflows if str(item).strip()))
          PY
          )"
          fi
          if [ -z "$WORKFLOWS" ]; then
            echo "ci=skip" >> "$GITHUB_OUTPUT"
            echo "目标分支未配置 auto_merge.ci_workflows，跳过 CI 门禁"
            exit 0
          fi
          python3 .agentgate/scripts/wait_ci.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$SOURCE_SHA" \
            --workflows "$WORKFLOWS" \
            --timeout-minutes 30 \
            --output "$GITHUB_OUTPUT"
      - name: Decide gate result
        id: gate
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if [ -z "$BASE_REF" ]; then echo "::error::pull_request.base.ref is required"; exit 1; fi
          git fetch -q origin "$BASE_REF"
          SOURCE_SHA="${{ github.event.pull_request.head.sha }}"
          TARGET_SHA="$(git rev-parse "origin/$BASE_REF")"
          CONFIG_PATH="${{ inputs.config-path }}"
          # 策略必须来自目标分支 (与 GitLab 一致), 不能读 PR 工作区, 否则 PR 可改写自己的门禁策略。
          # 目标分支尚无配置 (首次接入) 时使用内置默认值。
          if git cat-file -e "${TARGET_SHA}:${CONFIG_PATH}" 2>/dev/null; then
            POLICY_SHA="$(git rev-parse "${TARGET_SHA}:${CONFIG_PATH}")"
            POLICY_ARGS=(--target-ref "$TARGET_SHA")
          else
            POLICY_SHA="$TARGET_SHA"
            printf '{}\n' > "$RUNNER_TEMP/agentgate-default-policy.yml"
            POLICY_ARGS=(--config "$RUNNER_TEMP/agentgate-default-policy.yml")
          fi
          export SOURCE_SHA TARGET_SHA POLICY_SHA
          python - <<'PY' > gate-evidence.json
          import json
          import os

          checks = {
              "risk-scan": os.environ["RISK_SCAN"],
              "secret-scan": os.environ["SECRET_SCAN"],
              "mr-validate": os.environ["MR_VALIDATE"],
              "test-check": os.environ["TEST_CHECK"],
              "go-test": os.environ["GO_TEST"],
              "ci": os.environ.get("CI_CHECK", "skip"),
              "review": os.environ.get("REVIEW", "skip"),
          }
          print(json.dumps({
              "schema_version": "agentgate.io/ci-evidence/v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "target_sha": os.environ["TARGET_SHA"],
              "policy_sha": os.environ["POLICY_SHA"],
              "checks": checks,
          }, ensure_ascii=False))
          PY
          set +e
          python3 .agentgate/scripts/gate_decision.py \
            --evidence gate-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --target-sha "$TARGET_SHA" \
            --policy-sha "$POLICY_SHA" \
            --diff-base "origin/$BASE_REF" \
            --valid-approvals "$APPROVALS" \
            "${POLICY_ARGS[@]}" \
            --output gate-result.json
          DECISION_EXIT=$?
          set -e
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("gate-result.json", encoding="utf-8") as f:
              gate = json.load(f)
          print(f"merge_action={gate.get('merge_action', 'BLOCK')}")
          print(f"result={gate.get('result', 'FAIL')}")
          PY
          if [ "$DECISION_EXIT" -gt 1 ]; then
            exit "$DECISION_EXIT"
          fi
          # FAIL/ERROR 必须显示为失败, 否则被设为必过检查时被阻断的 PR 仍是绿色;
          # WAITING_APPROVAL 不是失败, 保持通过并提示需要人工审批。
          GATE_RESULT="$(python -c 'import json; print(json.load(open("gate-result.json", encoding="utf-8")).get("result", "FAIL"))')"
          case "$GATE_RESULT" in
            PASS) ;;
            WAITING_APPROVAL) echo "::notice::AgentGate: 等待人工审批 (critical 风险)" ;;
            *) echo "::error::AgentGate gate result: $GATE_RESULT"; exit 1 ;;
          esac
        env:
          RISK_SCAN: ${{ needs.risk-scan.result == 'success' && 'pass' || needs.risk-scan.result == 'skipped' && 'skip' || 'fail' }}
          SECRET_SCAN: ${{ needs.secret-scan.result == 'success' && 'pass' || needs.secret-scan.result == 'skipped' && 'skip' || 'fail' }}
          MR_VALIDATE: ${{ needs.mr-validate.result == 'success' && 'pass' || needs.mr-validate.result == 'skipped' && 'skip' || 'fail' }}
          TEST_CHECK: ${{ needs.test-check.result == 'success' && 'pass' || needs.test-check.result == 'skipped' && 'skip' || 'fail' }}
          GO_TEST: ${{ needs.go-test.result == 'success' && 'pass' || needs.go-test.result == 'skipped' && 'skip' || 'fail' }}
          CI_CHECK: ${{ steps.ci.outputs.ci }}
          REVIEW: ${{ github.event.pull_request.draft && 'skip' || needs.ai-review.outputs.review || 'fail' }}
          APPROVALS: ${{ steps.approvals.outputs.approvals || 0 }}
      - name: Upload gate result
        uses: actions/upload-artifact@v4
        with:
          name: agentgate-result
          path: gate-result.json

  auto-merge:
    needs: gate-decision
    # draft PR 与 fork PR 不开自动合并 (fork 的 head.repo 不同仓, 事件不可信且合并目标错误)
    # GitHub 已知行为: 依赖 job (gate-decision) 带 if: always() 时, 下游 if 里的
    # needs.*.outputs 在依赖完成前求值 (恒为空) → auto-merge 永远 skip。
    # if 只判静态条件, GateResult 判定移入 step 内做。
    if: ${{ always() && !inputs.skip-auto-merge && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # 工作流级 permissions 是 contents: read（其余任务最小权限），本 job 无覆盖时会继承 read，
    # enablePullRequestAutoMerge 必报 "Resource not accessible by integration"。
    # 此处按 job 单独放开；caller 侧同样需要 workflow/job 级 contents: write 作为上限。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: gate on GateResult
        env:
          MERGE_ACTION: ${{ needs.gate-decision.outputs.merge-action }}
          GATE_STATUS: ${{ needs.gate-decision.result }}
        run: |
          if [ "$GATE_STATUS" != "success" ] || [ "$MERGE_ACTION" != "AUTO_MERGE" ]; then
            echo "GateResult=$MERGE_ACTION (job=$GATE_STATUS), 不满足自动合并条件, 跳过。"
            # 只记日志不做判定；真正的闸门在下一步的 if 上——
            # 这里 exit 0 只能结束本 step，挡不住后面的 Enable auto merge（已实测漏过一次 FAIL 合并）。
            exit 0
          fi
      - name: Enable auto merge
        if: ${{ needs.gate-decision.result == 'success' && needs.gate-decision.outputs.merge-action == 'AUTO_MERGE' }}
        env:
          GH_TOKEN: ${{ secrets.GOVERNANCE_MERGE_BOT_TOKEN || github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # 复核 PR 当前 head 仍是本次判定的 head, 防止旧运行为新提交开自动合并
          CURRENT_HEAD="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)"
          if [ "$CURRENT_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head 已更新 ($CURRENT_HEAD != $EXPECTED_HEAD), 本次判定过期, 拒绝开启自动合并。"
            exit 1
          fi
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash \
            --delete-branch

  # =============================================================================
  # Governance Compound Flywheel: Pending Lessons Validation
  # =============================================================================
  pending-lessons-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout AgentGate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agentgate-repository }}
          ref: ${{ inputs.agentgate-ref }}
          path: .agentgate
      - name: Verify preinstalled Python dependencies
        run: python3 -c "import yaml; print('pyyaml ok')"
      - name: Validate pending lessons schema
        run: |
          # Validate pending lessons if directory exists and has files
          if [ -d ".governance/pending-lessons" ] && [ -n "$(ls -A .governance/pending-lessons/*.yml 2>/dev/null)" ]; then
            python3 .agentgate/scripts/validate_pending.py --root .
            echo "pending-validate=pass" >> "$GITHUB_OUTPUT"
          else
            echo "No pending lessons to validate (this is normal)"
            echo "pending-validate=skip" >> "$GITHUB_OUTPUT"
          fi
        id: validate
      - name: Run governance metrics (informational)
        if: always()
        run: |
          # Always show metrics for observability
          python3 .agentgate/scripts/governance_metrics.py --root . 2>/dev/null || true
