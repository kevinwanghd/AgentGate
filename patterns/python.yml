# Python 风险检测规则
# 适用范围: Python 2.7+ / Python 3.x
#
# 分级说明:
#   mode: block  — 高精度规则，误报极低，命中阻断 CI
#   mode: warn   — 观察期规则，误报较高，仅在 Job Summary 显示，不阻断 CI
#
# Tier 1 (block):  sql-injection | command-injection | hardcoded-secret | dangerous-eval | unsafe-deserialization
# Tier 2 (warn):  swallowed-exception | sensitive-log | debug-mode-production

patterns:

  # 1. SQL 注入风险
  - type: sql-injection
    # SQL 关键字须位于字符串字面量内且带词边界; .format 仅在 SQL 字面量上调用时命中
    regex: '(?:execute|executemany|raw)\s*\([^)]*[%+]|\bf["''](?=[^"'']*\b(?:SELECT|INSERT|UPDATE|DELETE)\b)[^"'']*\{|["''][^"'']*\b(?:SELECT|INSERT|UPDATE|DELETE)\b[^"'']*["'']\s*\.format\s*\('
    desc: "SQL 语句拼接存在注入风险，应使用参数化查询"
    exts: [".py"]
    mode: block

  # 2. 命令注入风险
  - type: command-injection
    regex: "(?:os\\.system|subprocess\\.call|subprocess\\.run|subprocess\\.Popen|eval|exec)\\s*\\([^)]*(?:%|\\.format|f[\"'])"
    desc: "命令拼接存在注入风险，应使用参数列表或 shlex.quote"
    exts: [".py"]
    mode: block

  # 3. 敏感信息硬编码
  - type: hardcoded-secret
    regex: "(?i)(?:password|passwd|secret|api[_-]?key|token|access[_-]?key)\\s*=\\s*[\"'][^\"']{8,}"
    desc: "敏感信息硬编码，应使用环境变量或密钥管理服务"
    exts: [".py"]
    mode: block

  # 4. 异常吞没
  # ⚠️ warn: except: pass 在 Python 生态极其常见，误报率高，先观察
  # 覆盖 bare except / except E as e / pass 在下一行; (?m) 使 $ 匹配行尾 (扫描窗口为多行)
  - type: swallowed-exception
    regex: '(?m)\bexcept\b[^:\n]*:\s*(?:pass|\.\.\.)[ \t]*(?:#.*)?$'
    desc: "异常被吞没，应至少记录日志或重新抛出"
    exts: [".py"]
    mode: warn

  # 5. eval/exec 动态执行
  - type: dangerous-eval
    # 前面不能是 . 或单词字符: 只拦内建 compile(), 放过 re.compile( 等方法调用
    regex: '(?<![.\w])(?:eval|exec|compile|__import__)\s*\('
    desc: "动态代码执行存在安全风险，应限制输入来源或使用 ast.literal_eval"
    exts: [".py"]
    mode: block

  # 6. pickle 反序列化
  - type: unsafe-deserialization
    regex: '\bpickle\.loads?\s*\('
    desc: "pickle 反序列化不可信数据存在 RCE 风险，应验证来源或使用 JSON"
    exts: [".py"]
    mode: block

  # 7. 敏感信息日志
  # ⚠️ warn: 仅因日志行中含敏感词变量名就阻断，误报率高，先观察
  - type: sensitive-log
    regex: "(?i)\\b(?:log|logger|logging)\\b.*\\b(?:password|passwd|token|secret|ssn|credit[_-]?card|id[_-]?card)\\b"
    desc: "敏感字段可能被写入日志，应脱敏处理"
    exts: [".py"]
    mode: warn

  # 8. Flask/Django DEBUG 模式
  # ⚠️ warn: DEBUG=True 在测试/本地配置里极其常见，误报率高，先观察
  - type: debug-mode-production
    regex: '(?:DEBUG|FLASK_DEBUG)\s*=\s*True'
    desc: "生产环境不应启用 DEBUG 模式，会泄露堆栈和环境信息"
    exts: [".py"]
    mode: warn
