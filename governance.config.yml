# AgentGate 治理配置 v1 (自举: AgentGate 用自己的规范管自己)
# 注意: 本仓库脚本在根级 scripts/, 与消费仓库的 governance/scripts/ 不同。
version: v1.2.1

auto_merge:
  enabled: true
  strategy: squash
  delete_branch_after_merge: true
  require_up_to_date_branch: true
  require_all_required_checks: true
  critical_approvals: 1       # critical 风险路径变更时需要的人工审批数
  high_approvals: 0
  # 单人维护者模式：关闭，正常走审批流
  single_maintainer_mode: false
  required_checks_by_risk:
    low:
      - risk-scan
      - secret-scan
      - mr-validate
    medium:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - python-test
    high:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - python-test
      - selftest
    critical:
      - risk-scan
      - secret-scan
      - mr-validate
      - test-check
      - python-test
      - selftest
  required_checks:
    - risk-scan
    - secret-scan
    - mr-validate
    - test-check
    - python-test
    - selftest
  # 保护分支: 只能通过 MR 合并，禁止直接推送
  protected_branches:
    - master
    - main
    - release/*
  protected_paths:
    - AGENTS.md
    - CLAUDE.md
    - .hermes.md
    - .github/copilot-instructions.md
    - .cursor/rules/**
    - governance.config.yml
    - .github/workflows/**
    - .gitlab-ci.yml
    - ci/**
    - governance/**
    - CODEOWNERS
    - scripts/scan_risks.py
    - scripts/check_tested.py
    - scripts/validate_mr.py
    - scripts/gate_decision.py
  risk_paths:
    low:
      - docs/**
      - "*.md"
      - templates/**
    high:
      - scripts/**
      - install.sh
      - .github/workflows/**
      - gitlab/**
    critical:
      - governance.config.yml
      - scripts/gate_decision.py
      - scripts/check_tested.py
      - scripts/validate_mr.py

metadata:
  enforcement: hard           # 自举: 新仓库无历史包袱, 直接硬启动
  soft_deadline: null
  mandatory_fields:
    - background
    - changes
    - self_test

risk_annotations:
  enforcement: hard           # 自举展示严格模式 (消费仓库默认 soft)
  reviewed_max_age_days: 90
  scan_exclude_paths:
    # 测试文件: 整目录豁免，避免测试代码含规则模式字面量导致自指误报
    - "tests/**"
    - "**/test*/**"       # test/, tests/, __tests__/ 等
    - "**/*.spec.*"        # .spec.ts / .spec.js 等
    - "**/*.test.*"        # .test.ts / .test.js 等
    # 第三方/生成代码: 不扫生成物
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/*.generated.*"
    - "**/dist/**"
    - "**/build/**"
    # AgentGate 自身脚本含规则正则字面量 (如 TODO|FIXME|HACK)，自指误报
    - "scripts/**"
  registered_types:
    - auth-bypass
    - magic-id
    - swallowed-exception
    - suppressed-warning
    - skipped-test
    - time-bypass
    - env-hardcode
    - todo-no-context
    - test-removal
    - untested
  reason_blacklist:
    - 临时
    - 先这样
    - 历史原因
    - TODO
    - 待确认
    - quick fix
    - temp
    - wip
    - hack
    - for now

large_change:
  line_threshold: 500
  excluded_paths:
    - "*.lock"
    - "*.Designer.cs"
    - "migrations/**"
    - "**/*.generated.*"
  sensitive_paths:
    - "ci/"
    - "CODEOWNERS"
    - ".github/"
    - "*secret*"
  schema_paths:
    - "*.sql"
    - "*.proto"

testing:
  enforcement: hard           # 自举: 直接硬启动
  soft_deadline: null
  accept_tested_trailer: false # Tested: 仅作开发声明，合并放行只看 CI Evidence Bundle
  untested_max_age_days: 90
  # 本仓库是工具包: 脚本目录是被测主体, 文档/模板/指令文件不要求测试
  # ci/ 不再整目录豁免 —— CI 配置改动同样需要测试证据
  exclude_paths:
    - "docs/**"
    - "templates/**"
    - "agent-instructions/**"
    - "*.md"
    - "install.sh"
    - "scripts/install-hooks.sh"
    - "scripts/selftest.sh"
  reason_blacklist:
    - 临时
    - 先这样
    - 历史原因
    - TODO
    - 待确认
    - quick fix
    - temp
    - wip
    - hack
    - for now

deliverhq_integration:
  enabled: false

create_mr:
  # AgentGate 自身开发必须吃自己的狗粮: 创建 PR/MR 前先跑与创建闭环相关的回归测试。
  # 全量测试仍应在提交前/CI 中单独运行；避免在 create_mr 自身流程里递归执行整套测试导致环境污染。
  # CI 或装了 pytest 的环境可用 --preflight-test-command pytest 覆盖。
  # 消费仓库可按技术栈覆盖，例如 flutter test / dotnet test / go test ./...
  preflight_test_command: python -m unittest tests.test_regressions.AgentGateCliTests
